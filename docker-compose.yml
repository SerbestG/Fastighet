# Utvecklingsmiljö. Produktionsuppsättning beskrivs i driftdokumentationen.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hemvist
    ports:
      - '5432:5432'
    volumes:
      - hemvist-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hemvist']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hemvist-db:
